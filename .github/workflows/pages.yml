name: Deploy E1 y E2 a GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "E1/**"
      - "E2/**"
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio (raíz + E1 + E2)
        run: |
          mkdir -p site
          cp -r E1 site/E1
          cp -r E2 site/E2
          cp index.html site/index.html
      - name: Subir sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
