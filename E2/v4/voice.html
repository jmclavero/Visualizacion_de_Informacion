<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Voz · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script>
  <script src="config.js?v=20261125m"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      overflow: hidden;
      background: #f9f9f7;
      color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      overscroll-behavior: none;
    }
    #hablar {
      flex: 0 0 auto;
      width: min(100%, 720px);
      height: clamp(110px, 26vh, 190px);
      border: 0;
      border-radius: 28px;
      padding: 0 24px;
      background: #1baf7a;
      color: #fff;
      font: inherit;
      font-size: clamp(1.8rem, 7vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 10px 30px rgba(27, 175, 122, 0.22);
      transition: filter 0.1s ease, transform 0.1s ease;
    }
    #hablar:active {
      filter: brightness(0.9);
      transform: scale(0.99);
    }
    #hablar:disabled { opacity: 0.75; cursor: default; }
    .panel {
      width: min(100%, 720px);
      padding: 16px 20px 18px;
      background: #fff;
      border: 1px solid #e1e0d9;
      border-radius: 20px;
    }
    #transcripcion {
      margin: 0 0 6px;
      min-height: 1.6em;
      font-size: 1.15rem;
      font-weight: 600;
    }
    #estado {
      margin: 0;
      min-height: 1.4em;
      color: #52514e;
      font-size: 0.92rem;
    }
    /* En horizontal el botón y el texto quedan lado a lado. */
    @media (orientation: landscape) and (max-height: 620px) {
      body {
        flex-direction: row;
        align-items: stretch;
        gap: 16px;
        padding: max(14px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }
      #hablar {
        width: auto;
        height: auto;
        min-height: 0;
        flex: 1 1 55%;
        border-radius: 24px;
        font-size: clamp(2rem, 5.5vw, 3.4rem);
      }
      .panel {
        width: auto;
        flex: 0 1 38%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <button id="hablar" type="button">HABLAR</button>
  <div class="panel">
    <p id="transcripcion"></p>
    <p id="estado">Toca HABLAR y di tu nombre.</p>
  </div>

  <script>
    (function () {
      var hablarBtn = document.getElementById("hablar");
      var transcripcionEl = document.getElementById("transcripcion");
      var estadoEl = document.getElementById("estado");

      var reconociendo = false;
      var ultimoTexto = "";
      var timerEscucha = null;

      // ---------- Sonidos del bee swarm, reproducidos en el celular ----------
      var ARCHIVOS_SONIDO = {
        "Teleseries": "sfx/applause.mp3",
        "Música / Viña": "sfx/saxophone.mp3",
        "Otras causas televisivas": "sfx/news.mp3",
        "Sin categoría": "sfx/no-classification.mp3",
      };
      var ESCALA_PENTATONICA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
      var NOTA_RAIZ_MIDI = 52;
      var AJUSTE_VOLUMEN = {
        "Otras causas televisivas": -4,
        "No televisivas": 4,
      };
      var RANGOS_AUDIO = {
        "Teleseries": { rateMin: 0.9, rateMax: 1.12, pitchMin: -2, pitchMax: 3 },
      };
      var RANGO_POR_DEFECTO = {
        rateMin: 0.9,
        rateMax: 1.35,
        pitchMin: -10,
        pitchMax: 7,
      };
      var voces = null;
      var pitchShift = null;
      var popSynth = null;
      var cargaPromesa = null;

      function tDesdeVeces(veces) {
        var t = Math.log(Number(veces) / 4) / Math.log(187 / 4);
        return Math.max(0, Math.min(1, t));
      }

      function notasDesdeT(t, cantidad) {
        var base = Math.round(
          Math.max(0, Math.min(1, t)) * (ESCALA_PENTATONICA.length - 1)
        );
        var notas = [];
        for (var i = 0; i < cantidad; i++) {
          var indice = Math.min(
            base + i * 2,
            ESCALA_PENTATONICA.length - 1
          );
          notas.push(
            Tone.Frequency(
              NOTA_RAIZ_MIDI + ESCALA_PENTATONICA[indice],
              "midi"
            ).toFrequency()
          );
        }
        return notas;
      }

      function asegurarAudio() {
        if (typeof Tone === "undefined") {
          return Promise.reject(new Error("Tone.js no está disponible"));
        }
        return Tone.start().then(function () {
          if (!cargaPromesa) {
            pitchShift = new Tone.PitchShift({ pitch: 0 }).toDestination();
            popSynth = new Tone.PolySynth(Tone.MembraneSynth, {
              pitchDecay: 0.01,
              octaves: 3,
              oscillator: { type: "sine" },
              envelope: {
                attack: 0.001,
                decay: 0.8,
                sustain: 0.08,
                release: 0.6,
              },
              volume: -8,
            }).connect(pitchShift);
            voces = new Tone.Players(ARCHIVOS_SONIDO).connect(pitchShift);
            cargaPromesa = Tone.loaded();
          }
          return cargaPromesa;
        });
      }

      function reproducirSonido(grupo, veces) {
        var clave = grupo === "No televisivas" ? "No televisivas" : grupo;
        var t = tDesdeVeces(Number(veces) || 4);
        var volumen = -18 + 12 * t + (AJUSTE_VOLUMEN[clave] || 0);
        volumen = Math.max(-10, Math.min(0, volumen));

        asegurarAudio()
          .then(function () {
            if (clave === "No televisivas") {
              if (!popSynth) return;
              if (voces) voces.stopAll();
              popSynth.volume.value = volumen;
              pitchShift.pitch = 0;
              var notas = notasDesdeT(t, 3);
              var intervalo = 0.45 - 0.15 * t;
              var tiempo = Tone.now() + 0.02;
              notas.forEach(function (frecuencia) {
                popSynth.triggerAttackRelease(frecuencia, "8n", tiempo);
                tiempo += intervalo * (0.9 + Math.random() * 0.2);
              });
              return;
            }

            if (!voces || !voces.has(clave)) return;
            voces.stopAll();
            var player = voces.player(clave);
            player.volume.value = volumen;
            var r = RANGOS_AUDIO[clave] || RANGO_POR_DEFECTO;
            player.playbackRate = r.rateMin + (r.rateMax - r.rateMin) * t;
            pitchShift.pitch = r.pitchMin + (r.pitchMax - r.pitchMin) * t;
            player.stop();
            player.start();
          })
          .catch(function (error) {
            console.warn("No se pudo reproducir el sonido:", error);
          });
      }

      if (typeof Protobject !== "undefined" && Protobject.Core) {
        Protobject.Core.onReceived(function (mensaje) {
          if (!mensaje || mensaje.tipo !== "sonido") return;
          reproducirSonido(mensaje.grupo, mensaje.veces);
        });
      }

      function enviar(mensaje) {
        if (typeof Protobject === "undefined" || !Protobject.Core) return;
        Protobject.Core.send(mensaje).to("index.html");
      }

      function limpiarNombre(texto) {
        return String(texto || "")
          .replace(/^(me llamo|mi nombre es|soy|el nombre es)\s+/i, "")
          .replace(/[.,!?¿¡]/g, "")
          .trim()
          .replace(/\s+/g, " ");
      }

      function terminarConError(texto) {
        reconociendo = false;
        clearTimeout(timerEscucha);
        hablarBtn.disabled = false;
        hablarBtn.textContent = "HABLAR";
        estadoEl.textContent = texto;
        enviar({ tipo: "voz", estado: "error", texto: texto });
      }

      function iniciar() {
        if (reconociendo) return;
        if (typeof Protobject === "undefined" || !Protobject.VoiceRecognition) {
          estadoEl.textContent = "Reconocimiento de voz no disponible en este navegador.";
          return;
        }

        reconociendo = true;
        ultimoTexto = "";
        transcripcionEl.textContent = "";
        hablarBtn.disabled = true;
        hablarBtn.textContent = "ESCUCHANDO…";
        estadoEl.textContent = "Di tu nombre.";
        enviar({ tipo: "voz", estado: "escuchando" });

        try {
          Protobject.VoiceRecognition.start("es-CL");
          clearTimeout(timerEscucha);
          timerEscucha = setTimeout(function () {
            if (reconociendo) {
              try { Protobject.VoiceRecognition.stop(); } catch (error) {}
            }
          }, 8000);
        } catch (error) {
          terminarConError("No se pudo iniciar el micrófono: " + error.message);
        }
      }

      if (typeof Protobject !== "undefined" && Protobject.VoiceRecognition) {
        Protobject.VoiceRecognition.onData(function (transcript) {
          ultimoTexto = transcript || "";
          transcripcionEl.textContent = ultimoTexto;
          // El componente usa reconocimiento continuo. Al recibir el nombre,
          // lo detenemos para que onFinish envíe el resultado.
          try { Protobject.VoiceRecognition.stop(); } catch (error) {}
        });

        Protobject.VoiceRecognition.onFinish(function () {
          clearTimeout(timerEscucha);
          reconociendo = false;
          hablarBtn.disabled = false;
          hablarBtn.textContent = "HABLAR";

          var nombre = limpiarNombre(ultimoTexto);
          if (!nombre) {
            terminarConError("No se entendió el nombre. Intenta de nuevo.");
            return;
          }

          transcripcionEl.textContent = "“" + nombre + "”";
          estadoEl.textContent = "Nombre enviado. Esperando el resultado…";
          enviar({ tipo: "voz", estado: "listo" });
          enviar({ tipo: "nombre", nombre: nombre });
        });

        hablarBtn.addEventListener("click", function () {
          asegurarAudio().catch(function (error) {
            console.warn("No se pudo habilitar el audio:", error);
          });
          iniciar();
        });
      } else {
        hablarBtn.disabled = true;
        estadoEl.textContent = "Este navegador no soporta reconocimiento de voz.";
      }
    })();
  </script>
</body>
</html>
