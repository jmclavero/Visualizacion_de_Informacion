<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>NFC · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hint { margin: 0; max-width: 38ch; color: #52514e; line-height: 1.45; font-size: .95rem; }
    .acciones { display: flex; flex-direction: column; gap: 10px; width: min(340px, 92vw); }
    button {
      border: 0; border-radius: 12px; padding: 14px 18px; font: inherit;
      font-size: 1rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6;
    }
    button.secundario { background: #52514e; }
    button.peligro { background: #e34948; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .lista { width: min(340px, 92vw); display: flex; flex-direction: column; gap: 6px; }
    .item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 10px; background: #fcfcfb;
      border: 1px solid rgba(11,11,11,.1); font-size: .9rem;
    }
    .item .nombre { flex: 1; text-align: left; }
    .item .marca { font-size: .78rem; white-space: nowrap; }
    .item button {
      padding: 6px 10px; font-size: .75rem; border-radius: 8px; white-space: nowrap;
    }
    input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: #2a78d6; flex: none;
    }
    .ok { color: #1baf7a; font-weight: 700; }
    .pend { color: #898781; }
    .estado { margin: 0; min-height: 2.6em; color: #52514e; font-size: .95rem; max-width: 36ch; }
  </style>
</head>
<body>
  <h1>Tarjetas NFC</h1>
  <p class="hint">
    Elige las tarjetas que tengas a mano: solo esas se aprenderán y se usarán
    para activar o desactivar su categoría en el beeswarm. Requiere Android + Chrome.
  </p>

  <div class="acciones" id="accionesSeleccion">
    <button id="usar" disabled>USAR SELECCIÓN</button>
  </div>

  <div class="acciones" id="accionesAprender" hidden>
    <button id="iniciar">INICIAR LECTOR NFC</button>
    <button id="probar" class="secundario">PROBAR TARJETA</button>
    <button id="cambiar" class="secundario">CAMBIAR SELECCIÓN</button>
    <button id="borrar" class="peligro">BORRAR TARJETAS APRENDIDAS</button>
  </div>

  <div class="lista" id="lista"></div>
  <p class="estado" id="estado">Elige las tarjetas que tengas a mano.</p>

  <script>
    (function () {
      var CATEGORIAS = [
        "Teleseries",
        "Música / Viña",
        "Otras causas televisivas",
        "No televisivas",
        "Sin identificar",
      ];
      var CLAVE_TARJETAS = "e2NfcTarjetas";
      var CLAVE_SELECCION = "e2NfcSeleccion";

      var tarjetas = {};
      try {
        tarjetas = JSON.parse(localStorage.getItem(CLAVE_TARJETAS) || "{}") || {};
      } catch (e) {
        tarjetas = {};
      }

      var seleccion = [];
      try {
        var guardada = JSON.parse(localStorage.getItem(CLAVE_SELECCION) || "null");
        if (Array.isArray(guardada)) {
          seleccion = guardada.filter(function (c) {
            return CATEGORIAS.indexOf(c) !== -1;
          });
        }
      } catch (e) {
        seleccion = [];
      }

      var vista = seleccion.length ? "aprender" : "seleccion";
      var aprendiendo = null; // categoría que se está aprendiendo (o null)
      var modoPrueba = false;
      var ultimoId = null;
      var ultimoTiempo = 0;
      var leyendo = false;

      var estadoEl = document.getElementById("estado");
      var listaEl = document.getElementById("lista");
      var probarBtn = document.getElementById("probar");
      var usarBtn = document.getElementById("usar");
      var accionesSeleccion = document.getElementById("accionesSeleccion");
      var accionesAprender = document.getElementById("accionesAprender");

      function guardarTarjetas() {
        localStorage.setItem(CLAVE_TARJETAS, JSON.stringify(tarjetas));
      }

      function guardarSeleccion() {
        localStorage.setItem(CLAVE_SELECCION, JSON.stringify(seleccion));
      }

      function seleccionada(cat) {
        return seleccion.indexOf(cat) !== -1;
      }

      function renderSeleccion() {
        listaEl.innerHTML = "";
        var marcadas = 0;

        CATEGORIAS.forEach(function (cat) {
          var fila = document.createElement("div");
          fila.className = "item";

          var chk = document.createElement("input");
          chk.type = "checkbox";
          chk.id = "chk-" + CATEGORIAS.indexOf(cat);
          chk.checked = seleccionada(cat);
          if (chk.checked) marcadas++;
          chk.addEventListener("change", function () {
            usarBtn.disabled = !document.querySelector("#lista input:checked");
          });

          var label = document.createElement("label");
          label.className = "nombre";
          label.htmlFor = chk.id;
          label.textContent = cat;

          fila.appendChild(chk);
          fila.appendChild(label);
          listaEl.appendChild(fila);
        });

        usarBtn.disabled = marcadas === 0;
      }

      function renderAprender() {
        listaEl.innerHTML = "";

        seleccion.forEach(function (cat) {
          var fila = document.createElement("div");
          fila.className = "item";

          var nombre = document.createElement("span");
          nombre.className = "nombre";
          nombre.textContent = cat;

          var marca = document.createElement("span");
          marca.className = tarjetas[cat] ? "ok marca" : "pend marca";
          marca.textContent = tarjetas[cat] ? "✓ aprendida" : "sin aprender";

          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = tarjetas[cat] ? "Reaprender" : "Aprender";
          btn.addEventListener("click", function () {
            iniciarAprendizaje(cat);
          });

          fila.appendChild(nombre);
          fila.appendChild(marca);
          fila.appendChild(btn);
          listaEl.appendChild(fila);
        });
      }

      function render() {
        accionesSeleccion.hidden = vista !== "seleccion";
        accionesAprender.hidden = vista !== "aprender";
        if (vista === "seleccion") {
          renderSeleccion();
        } else {
          renderAprender();
        }
      }

      function enviarCategoria(cat) {
        if (typeof Protobject === "undefined" || !Protobject.Core) return;
        Protobject.Core.send({ tipo: "nfc", categoria: cat }).to("index.html");
      }

      function iniciarAprendizaje(cat) {
        if (!leyendo) {
          estadoEl.textContent = "Primero toca INICIAR LECTOR NFC.";
          return;
        }
        if (!seleccionada(cat)) {
          estadoEl.textContent = "Esa categoría no está seleccionada.";
          return;
        }
        modoPrueba = false;
        probarBtn.textContent = "PROBAR TARJETA";
        aprendiendo = cat;
        estadoEl.textContent = "Acerca la tarjeta de: " + cat;
      }

      function alternarModoPrueba() {
        if (!leyendo) {
          estadoEl.textContent = "Primero toca INICIAR LECTOR NFC.";
          return;
        }
        modoPrueba = !modoPrueba;
        aprendiendo = null;
        probarBtn.textContent = modoPrueba
          ? "SALIR DE MODO PRUEBA"
          : "PROBAR TARJETA";
        estadoEl.textContent = modoPrueba
          ? "Modo prueba: acerca una tarjeta para ver su UID."
          : "Modo uso. Acerca una tarjeta aprendida y seleccionada.";
      }

      usarBtn.addEventListener("click", function () {
        var marcadas = [];
        document.querySelectorAll("#lista input:checked").forEach(function (chk) {
          var index = parseInt(chk.id.replace("chk-", ""), 10);
          marcadas.push(CATEGORIAS[index]);
        });
        if (!marcadas.length) {
          estadoEl.textContent = "Elige al menos una tarjeta.";
          return;
        }
        seleccion = marcadas;
        guardarSeleccion();
        vista = "aprender";
        render();
        estadoEl.textContent = "Selección guardada. Puedes aprender tus tarjetas.";
      });

      document.getElementById("cambiar").addEventListener("click", function () {
        vista = "seleccion";
        aprendiendo = null;
        modoPrueba = false;
        probarBtn.textContent = "PROBAR TARJETA";
        render();
        estadoEl.textContent = "Marca las tarjetas que tengas a mano.";
      });

      document.getElementById("iniciar").addEventListener("click", function () {
        if (typeof Protobject === "undefined" || !Protobject.NFC) {
          estadoEl.textContent = "Web NFC no está disponible en este dispositivo.";
          return;
        }
        Protobject.NFC.start();
        leyendo = true;
        modoPrueba = false;
        probarBtn.textContent = "PROBAR TARJETA";
        estadoEl.textContent = "Lector iniciado. Acerca una tarjeta.";
      });

      probarBtn.addEventListener("click", alternarModoPrueba);

      document.getElementById("borrar").addEventListener("click", function () {
        tarjetas = {};
        guardarTarjetas();
        render();
        aprendiendo = null;
        modoPrueba = false;
        probarBtn.textContent = "PROBAR TARJETA";
        estadoEl.textContent = "Tarjetas borradas. Vuelve a aprenderlas.";
      });

      if (typeof Protobject !== "undefined" && Protobject.NFC) {
        Protobject.NFC.onData(function (id) {
          // Modo prueba: solo mostrar el UID, sin aprender ni enviar.
          if (modoPrueba) {
            if (id === "err: no compatible") {
              estadoEl.textContent = "Tarjeta no legible por Web NFC.";
              return;
            }

            var categoriaPrueba = null;
            Object.keys(tarjetas).forEach(function (k) {
              if (tarjetas[k] === id) categoriaPrueba = k;
            });

            if (categoriaPrueba) {
              estadoEl.textContent =
                "UID: " + id + " (legible) · " + categoriaPrueba +
                (seleccionada(categoriaPrueba) ? " (habilitada)" : " (no habilitada)");
            } else {
              estadoEl.textContent = "UID: " + id + " (legible) · sin categoría aprendida";
            }
            return;
          }

          if (id === "err: no compatible") {
            estadoEl.textContent = "Tarjeta no compatible.";
            return;
          }

          // Aprendizaje de una sola categoría seleccionada.
          if (aprendiendo !== null) {
            tarjetas[aprendiendo] = id;
            guardarTarjetas();
            render();
            estadoEl.textContent = "✓ " + aprendiendo + " aprendida.";
            aprendiendo = null;
            return;
          }

          // Modo uso: buscar la categoría aprendida para este UID.
          var categoria = null;
          Object.keys(tarjetas).forEach(function (k) {
            if (tarjetas[k] === id) categoria = k;
          });

          if (!categoria) {
            estadoEl.textContent = "Tarjeta desconocida. Apréndela primero.";
            return;
          }

          if (!seleccionada(categoria)) {
            estadoEl.textContent =
              "Tarjeta de " + categoria + ", pero esa categoría no está habilitada.";
            return;
          }

          var ahora = Date.now();
          if (id === ultimoId && ahora - ultimoTiempo < 2000) return;
          ultimoId = id;
          ultimoTiempo = ahora;

          enviarCategoria(categoria);
          estadoEl.textContent = "Leída: " + categoria;
        });
      }

      if (vista === "aprender") {
        estadoEl.textContent = "Selección guardada. Puedes aprender tus tarjetas.";
      }
      render();
    })();
  </script>
</body>
</html>
