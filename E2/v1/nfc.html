<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>NFC · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hint { margin: 0; max-width: 36ch; color: #52514e; line-height: 1.45; font-size: .95rem; }
    .acciones { display: flex; flex-direction: column; gap: 10px; width: min(340px, 92vw); }
    button {
      border: 0; border-radius: 12px; padding: 14px 18px; font: inherit;
      font-size: 1rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6;
    }
    button.secundario { background: #52514e; }
    button.peligro { background: #e34948; }
    .lista { width: min(340px, 92vw); display: flex; flex-direction: column; gap: 6px; }
    .item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 10px; background: #fcfcfb;
      border: 1px solid rgba(11,11,11,.1); font-size: .9rem;
    }
    .item .nombre { flex: 1; text-align: left; }
    .item .marca { font-size: .78rem; white-space: nowrap; }
    .item button {
      padding: 6px 10px; font-size: .75rem; border-radius: 8px; white-space: nowrap;
    }
    .ok { color: #1baf7a; font-weight: 700; }
    .pend { color: #898781; }
    .estado { margin: 0; min-height: 2.6em; color: #52514e; font-size: .95rem; max-width: 36ch; }
  </style>
</head>
<body>
  <h1>Tarjetas NFC</h1>
  <p class="hint">
    Acerca una tarjeta a la parte trasera del Android para activar o desactivar
    su categoría en el beeswarm. Requiere Android + Chrome.
  </p>

  <div class="acciones">
    <button id="iniciar">INICIAR LECTOR NFC</button>
    <button id="probar" class="secundario">PROBAR TARJETA</button>
    <button id="borrar" class="peligro">BORRAR TARJETAS APRENDIDAS</button>
  </div>

  <div class="lista" id="lista"></div>
  <p class="estado" id="estado">Sin iniciar.</p>

  <script>
    (function () {
      var CATEGORIAS = [
        "Teleseries",
        "Música / Viña",
        "Otras causas televisivas",
        "No televisivas",
        "Sin identificar",
      ];
      var CLAVE = "e2NfcTarjetas";
      var tarjetas = {};
      try {
        tarjetas = JSON.parse(localStorage.getItem(CLAVE) || "{}") || {};
      } catch (e) {
        tarjetas = {};
      }

      var aprendiendo = null; // categoría que se está aprendiendo (o null)
      var modoPrueba = false;
      var ultimoId = null;
      var ultimoTiempo = 0;
      var leyendo = false;

      var estadoEl = document.getElementById("estado");
      var listaEl = document.getElementById("lista");
      var probarBtn = document.getElementById("probar");

      function guardar() {
        localStorage.setItem(CLAVE, JSON.stringify(tarjetas));
      }

      function renderLista() {
        listaEl.innerHTML = "";
        CATEGORIAS.forEach(function (cat) {
          var fila = document.createElement("div");
          fila.className = "item";

          var nombre = document.createElement("span");
          nombre.className = "nombre";
          nombre.textContent = cat;

          var marca = document.createElement("span");
          marca.className = tarjetas[cat] ? "ok marca" : "pend marca";
          marca.textContent = tarjetas[cat] ? "✓ aprendida" : "sin aprender";

          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = tarjetas[cat] ? "Reaprender" : "Aprender";
          btn.addEventListener("click", function () {
            iniciarAprendizaje(cat);
          });

          fila.appendChild(nombre);
          fila.appendChild(marca);
          fila.appendChild(btn);
          listaEl.appendChild(fila);
        });
      }

      function enviarCategoria(cat) {
        if (typeof Protobject === "undefined" || !Protobject.Core) return;
        Protobject.Core.send({ tipo: "nfc", categoria: cat }).to("index.html");
      }

      function iniciarAprendizaje(cat) {
        if (!leyendo) {
          estadoEl.textContent = "Primero toca INICIAR LECTOR NFC.";
          return;
        }
        modoPrueba = false;
        probarBtn.textContent = "PROBAR TARJETA";
        aprendiendo = cat;
        estadoEl.textContent = "Acerca la tarjeta de: " + cat;
      }

      function alternarModoPrueba() {
        if (!leyendo) {
          estadoEl.textContent = "Primero toca INICIAR LECTOR NFC.";
          return;
        }
        modoPrueba = !modoPrueba;
        aprendiendo = null;
        probarBtn.textContent = modoPrueba
          ? "SALIR DE MODO PRUEBA"
          : "PROBAR TARJETA";
        estadoEl.textContent = modoPrueba
          ? "Modo prueba: acerca una tarjeta para ver su UID."
          : "Modo uso. Acerca una tarjeta aprendida.";
      }

      document.getElementById("iniciar").addEventListener("click", function () {
        if (typeof Protobject === "undefined" || !Protobject.NFC) {
          estadoEl.textContent = "Web NFC no está disponible en este dispositivo.";
          return;
        }
        Protobject.NFC.start();
        leyendo = true;
        modoPrueba = false;
        probarBtn.textContent = "PROBAR TARJETA";
        estadoEl.textContent = "Lector iniciado. Acerca una tarjeta.";
      });

      probarBtn.addEventListener("click", alternarModoPrueba);

      document.getElementById("borrar").addEventListener("click", function () {
        tarjetas = {};
        guardar();
        renderLista();
        aprendiendo = null;
        modoPrueba = false;
        probarBtn.textContent = "PROBAR TARJETA";
        estadoEl.textContent = "Tarjetas borradas. Vuelve a aprenderlas.";
      });

      if (typeof Protobject !== "undefined" && Protobject.NFC) {
        Protobject.NFC.onData(function (id) {
          // Modo prueba: solo mostrar el UID, sin aprender ni enviar.
          if (modoPrueba) {
            if (id === "err: no compatible") {
              estadoEl.textContent = "Tarjeta no legible por Web NFC.";
            } else {
              estadoEl.textContent = "UID: " + id + " (legible)";
            }
            return;
          }

          if (id === "err: no compatible") {
            estadoEl.textContent = "Tarjeta no compatible.";
            return;
          }

          // Aprendizaje de una sola categoría.
          if (aprendiendo !== null) {
            tarjetas[aprendiendo] = id;
            guardar();
            renderLista();
            estadoEl.textContent = "✓ " + aprendiendo + " aprendida.";
            aprendiendo = null;
            return;
          }

          // Modo uso: buscar la categoría aprendida para este UID.
          var categoria = null;
          Object.keys(tarjetas).forEach(function (k) {
            if (tarjetas[k] === id) categoria = k;
          });

          if (!categoria) {
            estadoEl.textContent = "Tarjeta desconocida. Apréndela primero.";
            return;
          }

          var ahora = Date.now();
          if (id === ultimoId && ahora - ultimoTiempo < 2000) return;
          ultimoId = id;
          ultimoTiempo = ahora;

          enviarCategoria(categoria);
          estadoEl.textContent = "Leída: " + categoria;
        });
      }

      renderLista();
    })();
  </script>
</body>
</html>
