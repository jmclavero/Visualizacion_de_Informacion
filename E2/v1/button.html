<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Botón · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #1baf7a;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }
    #hablar {
      flex: 1;
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: #1baf7a;
      color: #fff;
      font: inherit;
      font-size: clamp(2rem, 9vw, 4.5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.1s ease;
    }
    #hablar:active { filter: brightness(0.9); }
    #estado {
      margin: 0;
      padding: 14px;
      min-height: 2.6em;
      background: #0e7f58;
      color: #fff;
      text-align: center;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    }
  </style>
</head>
<body>
  <button id="hablar" type="button">HABLAR</button>
  <p id="estado">Toca HABLAR y luego habla al micrófono del otro celular.</p>

  <script>
    (function () {
      var estadoEl = document.getElementById("estado");
      var hablar = document.getElementById("hablar");

      function enviar(mensaje) {
        if (typeof Protobject === "undefined" || !Protobject.Core) {
          estadoEl.textContent = "Protobject no está disponible.";
          return false;
        }
        Protobject.Core.send(mensaje).to("index.html");
        return true;
      }

      hablar.addEventListener("click", function () {
        if (enviar({ tipo: "boton" })) {
          estadoEl.textContent = "Botón enviado. El micrófono debería empezar a escuchar…";
        }
      });
    })();
  </script>
</body>
</html>
