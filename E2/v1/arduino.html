<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arduino · servo 180°</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 24px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hint { margin: 0; max-width: 48ch; color: #52514e; line-height: 1.45; font-size: .92rem; }
    .gauge {
      position: relative; width: min(340px, 88vw); height: 180px;
      border-radius: 340px 340px 0 0; background: #fcfcfb;
      border: 1px solid rgba(11,11,11,.1); overflow: hidden;
    }
    .gauge::after {
      content: ""; position: absolute; left: 50%; bottom: 0;
      width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
      background: #0b0b0b;
    }
    .aguja {
      position: absolute; left: 50%; bottom: 0; width: 3px; height: 150px;
      margin-left: -1.5px; background: #e34948; transform-origin: 50% 100%;
      transform: rotate(-90deg); transition: transform .35s ease;
    }
    .valor { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    button {
      border: 0; border-radius: 12px; padding: 14px 22px; font: inherit;
      font-size: 1rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secundario { background: #52514e; }
    .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .estado { margin: 0; color: #52514e; font-size: .95rem; min-height: 1.4em; max-width: 48ch; }
    .diag { margin: 0; color: #898781; font-size: .8rem; line-height: 1.5; max-width: 48ch; }
    .diag .mal { color: #c0392b; }
    .diag .bien { color: #1baf7a; }
    .log {
      width: min(460px, 92vw); height: 132px; overflow-y: auto; margin: 0;
      padding: 10px; border-radius: 10px; background: #fcfcfb;
      border: 1px solid rgba(11,11,11,.1);
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: .72rem; line-height: 1.5; text-align: left;
      white-space: pre-wrap; color: #52514e;
    }
  </style>
</head>
<body>
  <h1>Servo 180° · velocímetro del alza</h1>
  <p class="hint">
    Servo de <strong>180°</strong> en el <strong>pin 6</strong> (señal), 5 V y
    GND común. Al conectar queda en <strong>0° (izquierda)</strong> y solo se
    mueve cuando la visualización envía un ángulo. La placa responde
    <code>OK A&lt;ángulo&gt;</code>.
  </p>

  <div class="gauge">
    <div class="aguja" id="aguja"></div>
  </div>
  <div class="valor" id="valor">0°</div>
  <p class="estado" id="estado">Sin conectar.</p>
  <p class="diag" id="diag"></p>

  <div class="acciones">
    <button id="conectar" type="button">CONECTAR ARDUINO (Web Serial)</button>
    <button id="probar" type="button" class="secundario" disabled>PROBAR SERVO</button>
  </div>

  <pre class="log" id="log">Registro:</pre>

  <script>
    (function () {
      var conectado = false;
      var listo = false;
      var puerto = null;
      var escritor = null;
      var lector = null;
      var lecturaPromesa = null;
      var ultimoAngulo = 0;
      var neutro = 0;
      var colaEscritura = Promise.resolve();
      var logLineas = [];
      var temporizadorListo = null;

      var estadoEl = document.getElementById("estado");
      var valorEl = document.getElementById("valor");
      var agujaEl = document.getElementById("aguja");
      var diagEl = document.getElementById("diag");
      var logEl = document.getElementById("log");
      var conectarBtn = document.getElementById("conectar");
      var probarBtn = document.getElementById("probar");

      function log(texto) {
        logLineas.push(texto);
        if (logLineas.length > 14) logLineas.shift();
        logEl.textContent = "Registro:\n" + logLineas.join("\n");
        logEl.scrollTop = logEl.scrollHeight;
      }

      function actualizarBotones() {
        probarBtn.disabled = !(conectado && listo);
        conectarBtn.textContent = conectado
          ? "DESCONECTAR ARDUINO"
          : "CONECTAR ARDUINO (Web Serial)";
      }

      function actualizarDiagnostico() {
        var lineas = [];

        if (location.protocol === "file:") {
          lineas.push(
            '<span class="mal">✗</span> Estás abriendo con <code>file://</code>. ' +
            'Usa <code>http://localhost</code> o HTTPS (ejecuta <code>servir.ps1</code>).'
          );
        } else if (window.isSecureContext) {
          lineas.push('<span class="bien">✓</span> Contexto seguro');
        } else {
          lineas.push(
            '<span class="mal">✗</span> No es contexto seguro: abre con ' +
            '<code>http://localhost</code> o HTTPS.'
          );
        }

        if (navigator.serial) {
          lineas.push('<span class="bien">✓</span> Web Serial disponible');
        } else {
          lineas.push(
            '<span class="mal">✗</span> Web Serial no disponible: usa Chrome o ' +
            'Edge de escritorio.'
          );
        }

        diagEl.innerHTML = lineas.join("<br>");

        var disponible =
          location.protocol !== "file:" &&
          window.isSecureContext &&
          !!navigator.serial;
        conectarBtn.disabled = !disponible;
        if (!disponible) {
          estadoEl.textContent =
            "No se puede conectar desde este contexto. Sirve la página en localhost o HTTPS.";
        } else if (!conectado) {
          estadoEl.textContent = "Listo para conectar.";
        }
      }

      function marcarListo() {
        if (!conectado || listo) return;
        if (temporizadorListo) {
          clearTimeout(temporizadorListo);
          temporizadorListo = null;
        }
        listo = true;
        actualizarBotones();
        mostrarAngulo(neutro);
        estadoEl.textContent =
          "Arduino en " + Math.round(neutro) + "°. Esperando la señal de la página…";
      }

      function enviarSerial(texto) {
        colaEscritura = colaEscritura.then(async function () {
          if (!conectado || !escritor) return;
          try {
            await escritor.write(new TextEncoder().encode(texto));
            log("Enviado: " + texto.trim());
          } catch (error) {
            log("Error al enviar: " + error.name + " · " + error.message);
            estadoEl.textContent =
              "Se perdió la conexión con el Arduino. Vuelve a conectarlo.";
            await marcarDesconectado();
          }
        });
      }

      async function leerSerial() {
        if (!puerto || !puerto.readable) return;

        try {
          lector = puerto.readable.getReader();
          while (true) {
            var resultado = await lector.read();
            if (resultado.done) break;
            if (resultado.value) {
              var texto = new TextDecoder().decode(resultado.value).trim();
              if (texto) {
                log("Arduino: " + texto);
                if (texto.indexOf("Listo") !== -1) {
                  var m = texto.match(/Listo\s+(\d+)/);
                  if (m) {
                    neutro = Math.max(0, Math.min(180, Number(m[1])));
                  }
                  marcarListo();
                }
              }
            }
          }
        } catch (error) {
          if (conectado) log("Error de lectura: " + error.message);
        } finally {
          try { lector.releaseLock(); } catch (e) {}
          lector = null;
        }
      }

      async function marcarDesconectado() {
        conectado = false;
        listo = false;
        if (temporizadorListo) {
          clearTimeout(temporizadorListo);
          temporizadorListo = null;
        }
        try { if (lector) await lector.cancel(); } catch (e) {}
        lector = null;
        lecturaPromesa = null;
        try { if (escritor) escritor.releaseLock(); } catch (e) {}
        escritor = null;
        puerto = null;
        actualizarBotones();
      }

      function mostrarAngulo(angulo) {
        var a = Math.max(0, Math.min(180, Number(angulo) || 0));
        ultimoAngulo = a;
        valorEl.textContent = Math.round(a) + "°";
        agujaEl.style.transform = "rotate(" + (a - 90) + "deg)";
      }

      function aplicarAngulo(angulo) {
        mostrarAngulo(angulo);
        if (conectado && listo) {
          enviarSerial("A" + Math.round(ultimoAngulo) + "\n");
        }
      }

      async function conectar() {
        if (!window.isSecureContext || !navigator.serial) {
          actualizarDiagnostico();
          return;
        }

        conectarBtn.disabled = true;
        estadoEl.textContent = "Eligiendo el puerto serial…";
        log("Pidiendo puerto…");

        try {
          puerto = await navigator.serial.requestPort();
          await puerto.open({ baudRate: 9600 });
          escritor = puerto.writable.getWriter();

          conectado = true;
          listo = false;
          actualizarBotones();
          estadoEl.textContent = "Conectado. Esperando a que el Arduino reinicie…";

          var info = puerto.getInfo ? puerto.getInfo() : {};
          if (info.usbVendorId !== undefined) {
            log(
              "Puerto: VID 0x" + info.usbVendorId.toString(16) +
              " PID 0x" + info.usbProductId.toString(16)
            );
          }

          lecturaPromesa = leerSerial();

          // La Leonardo se reinicia al abrir el puerto. Normalmente el sketch
          // avisa "Listo"; si no llega, esperamos 4 s como respaldo.
          temporizadorListo = setTimeout(marcarListo, 4000);
        } catch (error) {
          log("No se pudo conectar: " + error.message);
          estadoEl.textContent = "No se pudo conectar: " + error.message;
          await marcarDesconectado();
          conectarBtn.disabled = false;
        }
      }

      async function desconectar() {
        conectado = false;
        listo = false;
        if (temporizadorListo) {
          clearTimeout(temporizadorListo);
          temporizadorListo = null;
        }
        actualizarBotones();

        try { if (lector) await lector.cancel(); } catch (e) {}
        try { if (lecturaPromesa) await lecturaPromesa; } catch (e) {}
        lector = null;
        lecturaPromesa = null;
        try { if (escritor) escritor.releaseLock(); } catch (e) {}
        escritor = null;
        try { if (puerto) await puerto.close(); } catch (e) {}
        puerto = null;

        estadoEl.textContent = "Desconectado.";
        log("Desconectado.");
      }

      async function probarServo() {
        if (!conectado || !listo) return;
        probarBtn.disabled = true;
        log("Prueba de servo: neutro → 45° → 135° → neutro");

        var comandos = ["N", "A45", "A135", "N"];
        var angulos = [neutro, 45, 135, neutro];

        for (var i = 0; i < comandos.length; i++) {
          enviarSerial(comandos[i] + "\n");
          mostrarAngulo(angulos[i]);
          await new Promise(function (resolve) { setTimeout(resolve, 800); });
        }

        probarBtn.disabled = !(conectado && listo);
      }

      conectarBtn.addEventListener("click", function () {
        if (conectado) {
          desconectar();
        } else {
          conectar();
        }
      });

      probarBtn.addEventListener("click", probarServo);

      if (navigator.serial) {
        navigator.serial.addEventListener("disconnect", function (event) {
          if (event.target !== puerto) return;
          log("Arduino desconectado físicamente.");
          estadoEl.textContent = "Arduino desconectado. Vuelve a conectarlo.";
          marcarDesconectado();
        });
      }

      if (typeof Protobject !== "undefined" && Protobject.Core) {
        Protobject.Core.onReceived(function (data) {
          if (!data || data.tipo !== "servo") return;

          if (data.reposo) {
            log("Protobject: reposo");
            mostrarAngulo(neutro);
            if (conectado && listo) enviarSerial("N\n");
            return;
          }

          log("Protobject: servo " + data.angulo);
          aplicarAngulo(data.angulo);
        });
      }

      actualizarDiagnostico();
      actualizarBotones();
      aplicarAngulo(0);
    })();
  </script>
</body>
</html>
