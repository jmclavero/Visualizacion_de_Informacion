<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Perilla · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; padding: 24px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; width: 100%; max-width: 900px;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    .hint { margin: 0; max-width: 40ch; color: #52514e; line-height: 1.45; }
    .lectura { font-size: 4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .fila { display: flex; gap: 18px; font-size: 1.1rem; color: #52514e; }
    .controles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button {
      border: 0; border-radius: 999px; padding: 14px 24px; font: inherit;
      font-size: 1rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6; box-shadow: 0 6px 18px rgba(42,120,214,.3);
    }
    button.secundario { background: #52514e; box-shadow: none; }
    button:disabled { opacity: .5; cursor: default; }
    .oculto { display: none; }
    .estado { margin: 0; color: #898781; font-size: .9rem; max-width: 40ch; }

    /* Si el teléfono está acostado pero el navegador sigue en vertical,
       rotamos toda la interfaz para que se lea en horizontal. */
    @media (orientation: portrait) {
      body { overflow: hidden; }
      .app {
        position: fixed; top: 50%; left: 50%;
        width: 100vh; height: 100vw; max-width: none;
        padding: 12px;
        gap: 12px;
        transform: translate(-50%, -50%) rotate(var(--giro, 90deg));
      }
      .app h1 { font-size: 1.2rem; }
      .app .lectura { font-size: 3rem; }
      .app .hint { font-size: .85rem; max-width: 52ch; }
    }

    @media (orientation: landscape) and (max-height: 480px) {
      body { gap: 10px; padding: 12px; }
      h1 { font-size: 1.2rem; }
      .lectura { font-size: 2.8rem; }
      .hint { font-size: .85rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Perilla</h1>
    <p class="hint">
      Acuesta el teléfono con la pantalla hacia arriba (horizontal) y gíralo
      sobre la mesa como una perilla. Una vuelta completa recorre 1920 → 2021
      en el detalle del punto.
    </p>

    <div class="lectura" id="valor">—</div>
    <div class="fila">
      <span id="sentido">—</span>
      <span id="vueltas">0 vueltas</span>
    </div>

    <div class="controles">
      <button id="pantalla">PANTALLA COMPLETA HORIZONTAL</button>
      <button id="girar" class="secundario">GIRAR 90°</button>
      <button id="calibrar" class="secundario">CALIBRAR COMO POSICIÓN 0</button>
      <button id="permiso" class="oculto">PEDIR PERMISO DE ORIENTACIÓN</button>
    </div>

    <p class="estado" id="estado">Esperando lectura del sensor…</p>
  </div>

  <script>
    (function () {
      var SENTIDO = -1;        // cambia a 1 si el giro queda invertido
      var UMBRAL_GRADOS = 1;   // cambio mínimo para enviar al PC

      var valorEl = document.getElementById("valor");
      var sentidoEl = document.getElementById("sentido");
      var vueltasEl = document.getElementById("vueltas");
      var estadoEl = document.getElementById("estado");
      var permisoBtn = document.getElementById("permiso");
      var calibrarBtn = document.getElementById("calibrar");
      var pantallaBtn = document.getElementById("pantalla");
      var girarBtn = document.getElementById("girar");

      var alphaAnterior = null;
      var acumulado = 0;
      var origen = null;
      var anguloPrevio = null;
      var giro = 90;
      var wakeLock = null;

      function enviar(mensaje) {
        if (typeof Protobject !== "undefined" && Protobject.Core) {
          Protobject.Core.send(mensaje).to("index.html");
        }
      }

      function reiniciarReferencia() {
        // Evita un salto falso cuando el navegador cambia de orientación.
        alphaAnterior = null;
        anguloPrevio = null;
      }

      async function pedirWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (error) {
          // Sin wake lock: la demo sigue funcionando.
        }
      }

      function handler(event) {
        var alpha = event.alpha;
        if (alpha === null || alpha === undefined) return;

        // La perilla solo tiene sentido con el teléfono plano, pantalla arriba.
        var beta = event.beta;
        var gamma = event.gamma;
        var plano = true;
        if (
          beta !== null && beta !== undefined &&
          gamma !== null && gamma !== undefined
        ) {
          plano = Math.abs(beta) < 30 && Math.abs(gamma) < 30;
        }

        if (!plano) {
          alphaAnterior = null;
          if (origen !== null) {
            estadoEl.textContent = "Acuesta el teléfono con la pantalla hacia arriba.";
          }
          return;
        }

        if (alphaAnterior !== null) {
          var delta = alpha - alphaAnterior;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          acumulado += delta * SENTIDO;
        }
        alphaAnterior = alpha;

        if (origen === null) {
          valorEl.textContent = "—";
          estadoEl.textContent = "Toca CALIBRAR para fijar la posición 0.";
          return;
        }

        var angulo = acumulado - origen;
        var vueltas = Math.trunc(angulo / 360);

        valorEl.textContent = Math.round(angulo) + "°";
        sentidoEl.textContent = angulo >= 0 ? "↻ Horario" : "↺ Antihorario";
        vueltasEl.textContent = vueltas + (Math.abs(vueltas) === 1 ? " vuelta" : " vueltas");
        estadoEl.textContent = "Enviando al computador…";

        if (anguloPrevio !== null && Math.abs(angulo - anguloPrevio) < UMBRAL_GRADOS) {
          return;
        }
        anguloPrevio = angulo;
        enviar({ tipo: "perilla", angulo: angulo });
      }

      pantallaBtn.addEventListener("click", async function () {
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape");
          }
          estadoEl.textContent = "Pantalla horizontal. Acuesta el teléfono y calibra.";
        } catch (error) {
          estadoEl.textContent =
            "No se pudo bloquear la orientación. Usa GIRAR 90° si hace falta.";
        }
        pedirWakeLock();
      });

      girarBtn.addEventListener("click", function () {
        giro = giro === 90 ? -90 : 90;
        document.documentElement.style.setProperty("--giro", giro + "deg");
        estadoEl.textContent =
          "Interfaz girada " + giro + "°. Ajusta según cómo apoyes el teléfono.";
      });

      calibrarBtn.addEventListener("click", function () {
        origen = acumulado;
        anguloPrevio = null;
        estadoEl.textContent = "Calibrado. Gira el teléfono.";
        pedirWakeLock();
      });

      // Reset que envía el PC al abrir un nuevo detalle.
      if (typeof Protobject !== "undefined" && Protobject.Core) {
        Protobject.Core.onReceived(function (mensaje) {
          if (mensaje && mensaje.tipo === "reset") {
            origen = acumulado;
            anguloPrevio = null;
            estadoEl.textContent = "Reiniciado por el computador. Gira desde aquí.";
          }
        });
      }

      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener("change", reiniciarReferencia);
      }
      window.addEventListener("orientationchange", reiniciarReferencia);

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") pedirWakeLock();
      });

      // iOS exige permiso desde un toque del usuario.
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        permisoBtn.classList.remove("oculto");
        permisoBtn.addEventListener("click", function () {
          DeviceOrientationEvent.requestPermission()
            .then(function (respuesta) {
              if (respuesta === "granted") {
                window.addEventListener("deviceorientation", handler, true);
                permisoBtn.classList.add("oculto");
                estadoEl.textContent = "Sensor activo. Toca CALIBRAR.";
              } else {
                estadoEl.textContent = "Permiso de orientación denegado.";
              }
            })
            .catch(function (error) {
              estadoEl.textContent = "Error: " + error.message;
            });
        });
      } else {
        window.addEventListener("deviceorientation", handler, true);
      }
    })();
  </script>
</body>
</html>
