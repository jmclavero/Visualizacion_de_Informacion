<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Perilla · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 20px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; width: 100%; max-width: 900px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hint { margin: 0; max-width: 44ch; color: #52514e; line-height: 1.45; font-size: .92rem; }
    .lectura { font-size: 3.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .fila { display: flex; gap: 18px; font-size: 1rem; color: #52514e; }
    .controles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 22px; font: inherit;
      font-size: .95rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6;
    }
    button.secundario { background: #52514e; }
    .oculto { display: none; }
    .estado { margin: 0; color: #898781; font-size: .9rem; max-width: 44ch; }
    .diag {
      margin: 0; color: #898781; font-size: .68rem; line-height: 1.5;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      max-width: 90vw; word-break: break-word;
    }

    /* Si el teléfono está acostado pero el navegador sigue en vertical,
       giramos la interfaz para que se lea de izquierda a derecha. */
    @media (orientation: portrait) {
      body { overflow: hidden; }
      .app {
        position: fixed; top: 50%; left: 50%;
        width: 100vh; height: 100vw; max-width: none;
        padding: 10px; gap: 10px;
        transform: translate(-50%, -50%) rotate(90deg);
      }
      .app h1 { font-size: 1.1rem; }
      .app .lectura { font-size: 2.6rem; }
      .app .hint { font-size: .8rem; max-width: 56ch; }
    }

    @media (orientation: landscape) and (max-height: 460px) {
      body { gap: 8px; padding: 10px; }
      h1 { font-size: 1.1rem; }
      .lectura { font-size: 2.4rem; }
      .hint { font-size: .8rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Perilla</h1>
    <p class="hint">
      Acuesta el teléfono con la pantalla hacia arriba y en horizontal. Gíralo
      sobre la mesa como una perilla: una vuelta completa recorre 1920 → 2021.
    </p>

    <div class="lectura" id="valor">0°</div>
    <div class="fila">
      <span id="sentido">↻ Horario</span>
      <span id="vueltas">0 vueltas</span>
    </div>

    <div class="controles">
      <button id="recalibrar" type="button">RECALIBRAR A 0°</button>
      <button id="invertir" type="button" class="secundario">INVERTIR GIRO</button>
      <button id="permiso" type="button" class="oculto">PEDIR PERMISO DE SENSORES</button>
    </div>

    <p class="estado" id="estado">Esperando sensores…</p>
    <p class="diag" id="diag">α — β — γ — · giro — °/s · gyro 0 · orient 0</p>
  </div>

  <script>
    (function () {
      // El giroscopio y la brújula tienen signos opuestos:
      // - giroscopio: el giro horario da tasa negativa.
      // - brújula: el giro horario aumenta alpha.
      // Con estos valores, el giro horario suma en ambos casos.
      var SENTIDO_GIRO = -1;
      var SENTIDO_ORIENTACION = 1;
      var UMBRAL_ENVIO = 1;      // grados mínimos para enviar al PC
      var DEADBAND = 0.6;        // °/s: ignora ruido del giroscopio

      var valorEl = document.getElementById("valor");
      var sentidoEl = document.getElementById("sentido");
      var vueltasEl = document.getElementById("vueltas");
      var estadoEl = document.getElementById("estado");
      var diagEl = document.getElementById("diag");
      var recalibrarBtn = document.getElementById("recalibrar");
      var invertirBtn = document.getElementById("invertir");
      var permisoBtn = document.getElementById("permiso");

      var invertido = false;
      try {
        invertido = localStorage.getItem("e2PerillaInvertida") === "1";
      } catch (error) {
        invertido = false;
      }

      function signoGiro() {
        return invertido ? -SENTIDO_GIRO : SENTIDO_GIRO;
      }

      function signoOrientacion() {
        return invertido ? -SENTIDO_ORIENTACION : SENTIDO_ORIENTACION;
      }

      var acumulado = 0;
      var ultimoEnviado = null;
      var alphaAnterior = null;
      var ultimoTiempoGyro = null;
      var ultimaTasa = null;
      var tasaFiltrada = 0;
      var giroscopioActivo = false;
      var ultimoEventoGyro = 0;
      var eventosGyro = 0;
      var eventosOrientacion = 0;
      var ultimoAlpha = null;
      var ultimoBeta = null;
      var ultimoGamma = null;
      var usandoOrientacion = false;
      var wakeLock = null;

      function fmt(v) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        return Number(v).toFixed(1);
      }

      function actualizarDiagnostico() {
        diagEl.textContent =
          "α " + fmt(ultimoAlpha) +
          "  β " + fmt(ultimoBeta) +
          "  γ " + fmt(ultimoGamma) +
          "  ·  giro " + fmt(ultimaTasa) + " °/s" +
          "  ·  gyro " + eventosGyro +
          "  ·  orient " + eventosOrientacion;
      }

      function enviar(mensaje) {
        if (typeof Protobject !== "undefined" && Protobject.Core) {
          Protobject.Core.send(mensaje).to("index.html");
        }
      }

      function actualizar() {
        valorEl.textContent = Math.round(acumulado) + "°";
        sentidoEl.textContent = acumulado >= 0 ? "↻ Horario" : "↺ Antihorario";

        var vueltas = Math.trunc(acumulado / 360);
        vueltasEl.textContent =
          vueltas + (Math.abs(vueltas) === 1 ? " vuelta" : " vueltas");

        if (giroscopioActivo) {
          estadoEl.textContent = "Leyendo el giroscopio…";
        } else if (usandoOrientacion) {
          estadoEl.textContent = "Leyendo la orientación…";
        } else {
          estadoEl.textContent = "Esperando sensores…";
        }

        actualizarDiagnostico();

        if (
          ultimoEnviado === null ||
          Math.abs(acumulado - ultimoEnviado) >= UMBRAL_ENVIO
        ) {
          ultimoEnviado = acumulado;
          enviar({ tipo: "perilla", angulo: acumulado });
        }
      }

      function recalibrar() {
        acumulado = 0;
        ultimoEnviado = null;
        ultimoTiempoGyro = null;
        tasaFiltrada = 0;
        alphaAnterior = ultimoAlpha;
        actualizar();
        estadoEl.textContent = "Recalibrado a 0°. Gira el teléfono.";
      }

      function actualizarBotonInvertir() {
        invertirBtn.textContent = invertido
          ? "SENTIDO: INVERTIDO"
          : "INVERTIR GIRO";
      }

      function invertirGiro() {
        invertido = !invertido;
        try {
          localStorage.setItem("e2PerillaInvertida", invertido ? "1" : "0");
        } catch (error) {
          // Sin persistencia: se mantiene solo en esta sesión.
        }
        acumulado = 0;
        ultimoEnviado = null;
        ultimoTiempoGyro = null;
        tasaFiltrada = 0;
        alphaAnterior = ultimoAlpha;
        actualizar();
        actualizarBotonInvertir();
        estadoEl.textContent =
          "Sentido " + (invertido ? "invertido" : "normal") + ". Gira para probar.";
      }

      // ---------- Giroscopio: fuente principal ----------
      function alMover(event) {
        eventosGyro++;

        var tasa = event.rotationRate ? event.rotationRate.alpha : null;
        ultimaTasa = tasa;

        if (tasa === null || tasa === undefined) {
          actualizarDiagnostico();
          return;
        }

        var ahora = performance.now();
        giroscopioActivo = true;
        usandoOrientacion = false;
        ultimoEventoGyro = ahora;

        if (ultimoTiempoGyro !== null) {
          var dt = (ahora - ultimoTiempoGyro) / 1000;
          if (dt > 0 && dt < 0.5) {
            // Suavizado suave para no acumular ruido.
            tasaFiltrada = tasaFiltrada * 0.7 + tasa * 0.3;
            var tasaUtil = Math.abs(tasaFiltrada) < DEADBAND ? 0 : tasaFiltrada;
            acumulado += tasaUtil * dt * signoGiro();
          }
        }

        ultimoTiempoGyro = ahora;
        actualizar();
      }

      // ---------- Orientación: respaldo ----------
      function alOrientar(event) {
        eventosOrientacion++;
        ultimoAlpha = event.alpha;
        ultimoBeta = event.beta;
        ultimoGamma = event.gamma;

        // Si el giroscopio está entregando datos, no duplicamos el giro.
        if (giroscopioActivo) {
          actualizarDiagnostico();
          return;
        }

        usandoOrientacion = true;

        if (event.alpha === null || event.alpha === undefined) {
          actualizarDiagnostico();
          return;
        }

        if (alphaAnterior !== null) {
          var delta = event.alpha - alphaAnterior;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          acumulado += delta * signoOrientacion();
        }

        alphaAnterior = event.alpha;
        actualizar();
      }

      // Si el giroscopio deja de entregar datos, volver a orientación.
      setInterval(function () {
        if (giroscopioActivo && performance.now() - ultimoEventoGyro > 1500) {
          giroscopioActivo = false;
          usandoOrientacion = true;
          alphaAnterior = ultimoAlpha;
          actualizar();
        }
      }, 500);

      async function pedirWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (error) {
          // Sin wake lock la demo sigue funcionando.
        }
      }

      recalibrarBtn.addEventListener("click", function () {
        recalibrar();
        pedirWakeLock();
      });

      invertirBtn.addEventListener("click", function () {
        invertirGiro();
        pedirWakeLock();
      });

      // Reset que envía el PC al abrir un nuevo detalle.
      if (typeof Protobject !== "undefined" && Protobject.Core) {
        Protobject.Core.onReceived(function (mensaje) {
          if (mensaje && mensaje.tipo === "reset") {
            recalibrar();
            estadoEl.textContent = "Reiniciado por el computador. Gira desde aquí.";
          }
        });
      }

      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener("change", function () {
          alphaAnterior = ultimoAlpha;
          ultimoTiempoGyro = null;
        });
      }

      // iOS exige permiso desde un toque del usuario.
      var necesitaPermiso =
        (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") ||
        (typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function");

      if (necesitaPermiso) {
        permisoBtn.classList.remove("oculto");
        permisoBtn.addEventListener("click", async function () {
          try {
            if (
              typeof DeviceOrientationEvent !== "undefined" &&
              typeof DeviceOrientationEvent.requestPermission === "function"
            ) {
              await DeviceOrientationEvent.requestPermission();
            }
            if (
              typeof DeviceMotionEvent !== "undefined" &&
              typeof DeviceMotionEvent.requestPermission === "function"
            ) {
              await DeviceMotionEvent.requestPermission();
            }
            window.addEventListener("devicemotion", alMover, true);
            window.addEventListener("deviceorientation", alOrientar, true);
            permisoBtn.classList.add("oculto");
            estadoEl.textContent = "Sensores activos.";
          } catch (error) {
            estadoEl.textContent = "Permiso de sensores denegado.";
          }
        });
      } else {
        window.addEventListener("devicemotion", alMover, true);
        window.addEventListener("deviceorientation", alOrientar, true);
      }

      actualizarBotonInvertir();
      actualizar();
    })();
  </script>
</body>
</html>
