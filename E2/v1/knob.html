<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Perilla · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 20px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; width: 100%; max-width: 900px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hint { margin: 0; max-width: 46ch; color: #52514e; line-height: 1.45; font-size: .92rem; }
    .lectura { font-size: 3.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .fila { display: flex; gap: 18px; font-size: 1rem; color: #52514e; }
    .controles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 22px; font: inherit;
      font-size: .95rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6;
    }
    button.secundario { background: #52514e; }
    .oculto { display: none; }
    .estado { margin: 0; color: #898781; font-size: .9rem; max-width: 46ch; }
    .diag {
      margin: 0; color: #898781; font-size: .68rem; line-height: 1.5;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      max-width: 92vw; word-break: break-word;
    }

    @media (orientation: portrait) {
      body { overflow: hidden; }
      .app {
        position: fixed; top: 50%; left: 50%;
        width: 100vh; height: 100vw; max-width: none;
        padding: 10px; gap: 10px;
        transform: translate(-50%, -50%) rotate(90deg);
      }
      .app h1 { font-size: 1.1rem; }
      .app .lectura { font-size: 2.6rem; }
      .app .hint { font-size: .8rem; max-width: 56ch; }
    }

    @media (orientation: landscape) and (max-height: 460px) {
      body { gap: 8px; padding: 10px; }
      h1 { font-size: 1.1rem; }
      .lectura { font-size: 2.4rem; }
      .hint { font-size: .8rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Perilla</h1>
    <p class="hint">
      Coloca el teléfono acostado sobre el spinner, con la pantalla hacia
      arriba. Dos vueltas completas recorren 1920 → 2021.
    </p>

    <div class="lectura" id="valor">0°</div>
    <div class="fila">
      <span id="sentido">↻ Horario</span>
      <span id="vueltas">0 vueltas</span>
    </div>

    <div class="controles">
      <button id="recalibrar" type="button">RECALIBRAR A 0°</button>
      <button id="invertir" type="button" class="secundario">INVERTIR GIRO</button>
      <button id="permiso" type="button" class="oculto">PEDIR PERMISO DE SENSORES</button>
    </div>

    <p class="estado" id="estado">Esperando sensores…</p>
    <p class="diag" id="diag">fuente: —</p>
  </div>

  <script>
    (function () {
      var UMBRAL_ENVIO = 1;
      var DEADBAND = 0.6;

      // El quaternion de AbsoluteOrientationSensor usa yaw positivo
      // antihorario; con -1 hacemos que el giro horario sume.
      var SIGNO_ORIENTATION = -1;
      var SIGNO_GIRO = -1;    // giroscopio: horario = positivo
      var SIGNO_BRUJULA = 1;  // brújula: horario = positivo

      var valorEl = document.getElementById("valor");
      var sentidoEl = document.getElementById("sentido");
      var vueltasEl = document.getElementById("vueltas");
      var estadoEl = document.getElementById("estado");
      var diagEl = document.getElementById("diag");
      var recalibrarBtn = document.getElementById("recalibrar");
      var invertirBtn = document.getElementById("invertir");
      var permisoBtn = document.getElementById("permiso");

      var invertido = false;
      try {
        invertido = localStorage.getItem("e2PerillaInvertida") === "1";
      } catch (error) {
        invertido = false;
      }

      var acumulado = 0;
      var ultimoEnviado = null;
      var usando = "ninguna"; // orientation | gyro | brujula

      // Protobject.Orientation
      var orientacionIniciada = false;
      var ultimoHorizontal = null;
      var ultimoHorizontalCont = null;
      var ultimoVertical = null;
      var origenOrientation = null;

      // Giroscopio
      var giroIniciado = false;
      var ultimoTiempoGyro = null;
      var ultimaTasa = null;
      var ultimoEventoGyro = 0;
      var eventosGyro = 0;

      // Brújula
      var brujulaIniciada = false;
      var alphaAnterior = null;
      var ultimoAlpha = null;
      var ultimoBeta = null;
      var ultimoGamma = null;
      var eventosOrient = 0;

      var wakeLock = null;

      function signo(base) {
        return invertido ? -base : base;
      }

      function fmt(v) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        return Number(v).toFixed(1);
      }

      function actualizarDiagnostico() {
        var detalle = "fuente: " + usando;
        if (usando === "orientation") {
          detalle +=
            "  ·  h " + fmt(ultimoHorizontal) +
            "  ·  hCont " + fmt(ultimoHorizontalCont) +
            "  ·  v " + fmt(ultimoVertical);
        } else if (usando === "gyro") {
          detalle +=
            "  ·  giro " + fmt(ultimaTasa) + " °/s" +
            "  ·  gyro " + eventosGyro;
        } else if (usando === "brujula") {
          detalle +=
            "  ·  α " + fmt(ultimoAlpha) +
            "  ·  β " + fmt(ultimoBeta) +
            "  ·  γ " + fmt(ultimoGamma) +
            "  ·  orient " + eventosOrient;
        }
        detalle += "  ·  " + (invertido ? "invertido" : "normal");
        diagEl.textContent = detalle;
      }

      function enviar(mensaje) {
        if (typeof Protobject !== "undefined" && Protobject.Core) {
          Protobject.Core.send(mensaje).to("index.html");
        }
      }

      function actualizar() {
        valorEl.textContent = Math.round(acumulado) + "°";
        sentidoEl.textContent = acumulado >= 0 ? "↻ Horario" : "↺ Antihorario";

        var vueltas = Math.trunc(acumulado / 360);
        vueltasEl.textContent =
          vueltas + (Math.abs(vueltas) === 1 ? " vuelta" : " vueltas");

        if (usando === "orientation") {
          estadoEl.textContent = "Leyendo Protobject.Orientation…";
        } else if (usando === "gyro") {
          estadoEl.textContent = "Leyendo el giroscopio…";
        } else if (usando === "brujula") {
          estadoEl.textContent = "Leyendo la brújula…";
        } else {
          estadoEl.textContent = "Esperando sensores…";
        }

        actualizarDiagnostico();

        if (
          ultimoEnviado === null ||
          Math.abs(acumulado - ultimoEnviado) >= UMBRAL_ENVIO
        ) {
          ultimoEnviado = acumulado;
          enviar({ tipo: "perilla", angulo: acumulado });
        }
      }

      function recalibrar() {
        acumulado = 0;
        ultimoEnviado = null;

        if (usando === "orientation" && ultimoHorizontalCont !== null) {
          origenOrientation = ultimoHorizontalCont;
        } else if (usando === "gyro") {
          ultimoTiempoGyro = null;
        } else if (usando === "brujula") {
          alphaAnterior = ultimoAlpha;
        }

        actualizar();
        estadoEl.textContent = "Recalibrado a 0°. Gira el spinner.";
      }

      function actualizarBotonInvertir() {
        invertirBtn.textContent = invertido
          ? "SENTIDO: INVERTIDO"
          : "INVERTIR GIRO";
      }

      function invertirGiro() {
        invertido = !invertido;
        try {
          localStorage.setItem("e2PerillaInvertida", invertido ? "1" : "0");
        } catch (error) {
          // Sin persistencia: se mantiene solo en esta sesión.
        }
        recalibrar();
        actualizarBotonInvertir();
      }

      // ---------- 1. Protobject.Orientation ----------
      function iniciarOrientacion() {
        if (orientacionIniciada) return;
        if (typeof Protobject === "undefined" || !Protobject.Orientation) {
          return;
        }
        orientacionIniciada = true;

        // Importante: start() reinicia el callback interno, así que primero
        // se inicia el componente y después se registra onData.
        Protobject.Orientation.start(50);

        Protobject.Orientation.onData(function (data) {
          if (!data || data.horizontalContinuous === undefined) return;

          ultimoHorizontal = data.horizontal;
          ultimoHorizontalCont = data.horizontalContinuous;
          ultimoVertical = data.vertical;

          if (usando !== "orientation") {
            // Cambiamos de fuente: empezamos desde la posición actual.
            usando = "orientation";
            origenOrientation = data.horizontalContinuous;
            acumulado = 0;
          }

          if (origenOrientation === null) {
            origenOrientation = data.horizontalContinuous;
          }

          acumulado =
            (data.horizontalContinuous - origenOrientation) *
            signo(SIGNO_ORIENTATION);

          actualizar();
        });
      }

      // ---------- 2. Giroscopio (respaldo) ----------
      function alMover(event) {
        eventosGyro++;
        var tasa = event.rotationRate ? event.rotationRate.alpha : null;
        ultimaTasa = tasa;
        if (tasa === null || tasa === undefined) return;
        if (usando === "orientation") return;

        if (usando !== "gyro") {
          usando = "gyro";
          acumulado = 0;
          ultimoTiempoGyro = null;
        }

        var ahora = performance.now();
        if (ultimoTiempoGyro !== null) {
          var dt = (ahora - ultimoTiempoGyro) / 1000;
          if (dt > 0) {
            dt = Math.min(dt, 1.5);
            var tasaUtil = Math.abs(tasa) < DEADBAND ? 0 : tasa;
            acumulado += tasaUtil * dt * signo(SIGNO_GIRO);
          }
        }
        ultimoTiempoGyro = ahora;
        actualizar();
      }

      function iniciarGiroscopio() {
        if (giroIniciado) return;
        giroIniciado = true;
        window.addEventListener("devicemotion", alMover, true);

        setTimeout(function () {
          if (usando === "ninguna" || usando === "gyro") iniciarBrujula();
        }, 1500);
      }

      // ---------- 3. Brújula (último respaldo) ----------
      function alOrientar(event) {
        eventosOrient++;
        ultimoAlpha = event.alpha;
        ultimoBeta = event.beta;
        ultimoGamma = event.gamma;

        if (event.alpha === null || event.alpha === undefined) return;
        if (usando === "orientation" || usando === "gyro") return;

        if (usando !== "brujula") {
          usando = "brujula";
          acumulado = 0;
          alphaAnterior = event.alpha;
        } else if (alphaAnterior !== null) {
          var delta = event.alpha - alphaAnterior;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          acumulado += delta * signo(SIGNO_BRUJULA);
        }

        alphaAnterior = event.alpha;
        actualizar();
      }

      function iniciarBrujula() {
        if (brujulaIniciada) return;
        brujulaIniciada = true;
        window.addEventListener("deviceorientation", alOrientar, true);
      }

      // ---------- Arranque ----------
      async function pedirWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (error) {
          // Sin wake lock la demo sigue funcionando.
        }
      }

      recalibrarBtn.addEventListener("click", function () {
        recalibrar();
        pedirWakeLock();
      });

      invertirBtn.addEventListener("click", function () {
        invertirGiro();
        pedirWakeLock();
      });

      // Reset que envía el PC al abrir un nuevo detalle.
      if (typeof Protobject !== "undefined" && Protobject.Core) {
        Protobject.Core.onReceived(function (mensaje) {
          if (mensaje && mensaje.tipo === "reset") {
            recalibrar();
            estadoEl.textContent = "Reiniciado por el computador. Gira desde aquí.";
          }
        });
      }

      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener("change", function () {
          alphaAnterior = ultimoAlpha;
        });
      }

      var necesitaPermiso =
        (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") ||
        (typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function");

      if (necesitaPermiso) {
        permisoBtn.classList.remove("oculto");
        permisoBtn.addEventListener("click", async function () {
          try {
            if (
              typeof DeviceOrientationEvent !== "undefined" &&
              typeof DeviceOrientationEvent.requestPermission === "function"
            ) {
              await DeviceOrientationEvent.requestPermission();
            }
            if (
              typeof DeviceMotionEvent !== "undefined" &&
              typeof DeviceMotionEvent.requestPermission === "function"
            ) {
              await DeviceMotionEvent.requestPermission();
            }
            iniciarOrientacion();
            iniciarGiroscopio();
            iniciarBrujula();
            permisoBtn.classList.add("oculto");
            estadoEl.textContent = "Sensores activos.";
          } catch (error) {
            estadoEl.textContent = "Permiso de sensores denegado.";
          }
        });
      } else {
        iniciarOrientacion();
        // Si Orientation no entrega datos, probamos giroscopio y brújula.
        setTimeout(function () {
          if (usando !== "orientation") iniciarGiroscopio();
        }, 2000);
      }

      actualizarBotonInvertir();
      actualizar();
    })();
  </script>
</body>
</html>
