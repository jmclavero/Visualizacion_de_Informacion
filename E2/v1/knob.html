<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Perilla · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 20px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; width: 100%; max-width: 900px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hint { margin: 0; max-width: 44ch; color: #52514e; line-height: 1.45; font-size: .92rem; }
    .lectura { font-size: 3.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .fila { display: flex; gap: 18px; font-size: 1rem; color: #52514e; }
    .controles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 22px; font: inherit;
      font-size: .95rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6;
    }
    button.secundario { background: #52514e; }
    .oculto { display: none; }
    .estado { margin: 0; color: #898781; font-size: .9rem; max-width: 44ch; min-height: 1.4em; }

    @media (orientation: portrait) {
      body { overflow: hidden; }
      .app {
        position: fixed; top: 50%; left: 50%;
        width: 100vh; height: 100vw; max-width: none;
        padding: 10px; gap: 10px;
        transform: translate(-50%, -50%) rotate(90deg);
      }
      .app h1 { font-size: 1.1rem; }
      .app .lectura { font-size: 2.6rem; }
      .app .hint { font-size: .8rem; max-width: 56ch; }
    }

    @media (orientation: landscape) and (max-height: 460px) {
      body { gap: 8px; padding: 10px; }
      h1 { font-size: 1.1rem; }
      .lectura { font-size: 2.4rem; }
      .hint { font-size: .8rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Perilla</h1>
    <p class="hint">
      Gira el teléfono sobre la mesa o el spinner como una perilla. La pantalla
      marca el ángulo desde la posición calibrada. Dos vueltas completas = 720°.
    </p>

    <div class="lectura" id="valor">—</div>
    <div class="fila">
      <span id="sentido">—</span>
      <span id="vueltas">0 vueltas</span>
    </div>

    <div class="controles">
      <button id="calibrar" type="button">CALIBRAR COMO POSICIÓN 0</button>
      <button id="permiso" type="button" class="oculto">PEDIR PERMISO DE ORIENTACIÓN</button>
    </div>

    <p class="estado" id="estado">Esperando lectura del sensor…</p>
  </div>

  <script>
    (function () {
      // Disminuir alpha = giro horario = avanzar a la derecha.
      var SENTIDO = -1;
      var UMBRAL_GRADOS = 1;

      var valorEl = document.getElementById("valor");
      var sentidoEl = document.getElementById("sentido");
      var vueltasEl = document.getElementById("vueltas");
      var estadoEl = document.getElementById("estado");
      var calibrarBtn = document.getElementById("calibrar");
      var permisoBtn = document.getElementById("permiso");

      var alphaAnterior = null;
      var acumulado = 0;
      var origen = null;
      var anguloPrevio = null;

      function enviar(angulo, vueltas) {
        if (typeof Protobject !== "undefined" && Protobject.Core) {
          Protobject.Core.send({ tipo: "perilla", angulo: angulo, vueltas: vueltas }).to("index.html");
        }
      }

      function handler(event) {
        var alpha = event.alpha;

        if (alpha === null || alpha === undefined) {
          estadoEl.textContent = "Esperando lectura del sensor…";
          return;
        }

        if (alphaAnterior !== null) {
          var delta = alpha - alphaAnterior;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          acumulado += delta * SENTIDO;
        }
        alphaAnterior = alpha;

        if (origen === null) {
          valorEl.textContent = "—";
          estadoEl.textContent = "Toca CALIBRAR COMO POSICIÓN 0.";
          return;
        }

        var angulo = acumulado - origen;
        var vueltas = Math.trunc(angulo / 360);

        valorEl.textContent = Math.round(angulo) + "°";
        sentidoEl.textContent = angulo >= 0 ? "↻ Horario" : "↺ Antihorario";
        vueltasEl.textContent =
          vueltas + (Math.abs(vueltas) === 1 ? " vuelta" : " vueltas");
        estadoEl.textContent = "Girando…";

        if (
          anguloPrevio !== null &&
          Math.abs(angulo - anguloPrevio) < UMBRAL_GRADOS
        ) {
          return;
        }
        anguloPrevio = angulo;
        enviar(angulo, vueltas);
      }

      function calibrar() {
        origen = acumulado;
        anguloPrevio = null;
        valorEl.textContent = "0°";
        sentidoEl.textContent = "↻ Horario";
        vueltasEl.textContent = "0 vueltas";
        estadoEl.textContent = "Calibrado. Gira el teléfono.";
      }

      calibrarBtn.addEventListener("click", calibrar);

      // Reset que envía el PC al abrir un nuevo detalle.
      if (typeof Protobject !== "undefined" && Protobject.Core) {
        Protobject.Core.onReceived(function (mensaje) {
          if (mensaje && mensaje.tipo === "reset") {
            calibrar();
            estadoEl.textContent = "Reiniciado por el computador. Gira desde aquí.";
          }
        });
      }

      // iOS exige permiso desde un toque del usuario.
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        permisoBtn.classList.remove("oculto");
        permisoBtn.addEventListener("click", function () {
          DeviceOrientationEvent.requestPermission()
            .then(function (respuesta) {
              if (respuesta === "granted") {
                window.addEventListener("deviceorientation", handler, true);
                permisoBtn.classList.add("oculto");
                estadoEl.textContent = "Sensor activo. Toca CALIBRAR.";
              } else {
                estadoEl.textContent = "Permiso de orientación denegado.";
              }
            })
            .catch(function (error) {
              estadoEl.textContent = "Error: " + error.message;
            });
        });
      } else {
        window.addEventListener("deviceorientation", handler, true);
      }
    })();
  </script>
</body>
</html>
