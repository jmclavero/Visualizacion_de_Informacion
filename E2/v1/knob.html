<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Perilla · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 20px;
      background: #f9f9f7; color: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; width: 100%; max-width: 900px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .hint { margin: 0; max-width: 44ch; color: #52514e; line-height: 1.45; font-size: .92rem; }
    .lectura { font-size: 3.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .fila { display: flex; gap: 18px; font-size: 1rem; color: #52514e; }
    .controles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 22px; font: inherit;
      font-size: .95rem; font-weight: 700; cursor: pointer; color: #fff;
      background: #2a78d6;
    }
    button.secundario { background: #52514e; }
    .oculto { display: none; }
    .estado { margin: 0; color: #898781; font-size: .9rem; max-width: 44ch; }
    .diag {
      margin: 0; color: #898781; font-size: .68rem; line-height: 1.5;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      max-width: 90vw; word-break: break-word;
    }

    /* Si el teléfono está acostado pero el navegador sigue en vertical,
       giramos la interfaz para que se lea de izquierda a derecha. */
    @media (orientation: portrait) {
      body { overflow: hidden; }
      .app {
        position: fixed; top: 50%; left: 50%;
        width: 100vh; height: 100vw; max-width: none;
        padding: 10px; gap: 10px;
        transform: translate(-50%, -50%) rotate(90deg);
      }
      .app h1 { font-size: 1.1rem; }
      .app .lectura { font-size: 2.6rem; }
      .app .hint { font-size: .8rem; max-width: 56ch; }
    }

    @media (orientation: landscape) and (max-height: 460px) {
      body { gap: 8px; padding: 10px; }
      h1 { font-size: 1.1rem; }
      .lectura { font-size: 2.4rem; }
      .hint { font-size: .8rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Perilla</h1>
    <p class="hint">
      Acuesta el teléfono con la pantalla hacia arriba y gíralo como una
      brújula. Dos vueltas completas recorren 1920 → 2021.
    </p>

    <div class="lectura" id="valor">0°</div>
    <div class="fila">
      <span id="sentido">↻ Horario</span>
      <span id="vueltas">0 vueltas</span>
    </div>

    <div class="controles">
      <button id="recalibrar" type="button">RECALIBRAR A 0°</button>
      <button id="invertir" type="button" class="secundario">INVERTIR GIRO</button>
      <button id="permiso" type="button" class="oculto">PEDIR PERMISO DE ORIENTACIÓN</button>
    </div>

    <p class="estado" id="estado">Esperando la brújula…</p>
    <p class="diag" id="diag">α —  β —  γ —  ·  orient 0</p>
  </div>

  <script>
    (function () {
      // La brújula (alpha) aumenta en sentido horario. Ese es el sentido
      // que queremos: girar a la derecha avanza hacia la derecha.
      var SENTIDO = 1;
      var UMBRAL_ENVIO = 1;

      var valorEl = document.getElementById("valor");
      var sentidoEl = document.getElementById("sentido");
      var vueltasEl = document.getElementById("vueltas");
      var estadoEl = document.getElementById("estado");
      var diagEl = document.getElementById("diag");
      var recalibrarBtn = document.getElementById("recalibrar");
      var invertirBtn = document.getElementById("invertir");
      var permisoBtn = document.getElementById("permiso");

      var invertido = false;
      try {
        invertido = localStorage.getItem("e2PerillaInvertida") === "1";
      } catch (error) {
        invertido = false;
      }

      var acumulado = 0;
      var ultimoEnviado = null;
      var alphaAnterior = null;
      var ultimoAlpha = null;
      var ultimoBeta = null;
      var ultimoGamma = null;
      var eventos = 0;
      var wakeLock = null;

      function signo() {
        return invertido ? -SENTIDO : SENTIDO;
      }

      function fmt(v) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        return Number(v).toFixed(1);
      }

      function actualizarDiagnostico() {
        diagEl.textContent =
          "α " + fmt(ultimoAlpha) +
          "  β " + fmt(ultimoBeta) +
          "  γ " + fmt(ultimoGamma) +
          "  ·  orient " + eventos +
          "  ·  " + (invertido ? "invertido" : "normal");
      }

      function enviar(mensaje) {
        if (typeof Protobject !== "undefined" && Protobject.Core) {
          Protobject.Core.send(mensaje).to("index.html");
        }
      }

      function actualizar() {
        valorEl.textContent = Math.round(acumulado) + "°";
        sentidoEl.textContent = acumulado >= 0 ? "↻ Horario" : "↺ Antihorario";

        var vueltas = Math.trunc(acumulado / 360);
        vueltasEl.textContent =
          vueltas + (Math.abs(vueltas) === 1 ? " vuelta" : " vueltas");

        estadoEl.textContent =
          eventos === 0 ? "Esperando la brújula…" : "Leyendo la brújula…";

        actualizarDiagnostico();

        if (
          ultimoEnviado === null ||
          Math.abs(acumulado - ultimoEnviado) >= UMBRAL_ENVIO
        ) {
          ultimoEnviado = acumulado;
          enviar({ tipo: "perilla", angulo: acumulado });
        }
      }

      function recalibrar() {
        acumulado = 0;
        ultimoEnviado = null;
        alphaAnterior = ultimoAlpha;
        actualizar();
        estadoEl.textContent = "Recalibrado a 0°. Gira el teléfono.";
      }

      function actualizarBotonInvertir() {
        invertirBtn.textContent = invertido
          ? "SENTIDO: INVERTIDO"
          : "INVERTIR GIRO";
      }

      function invertirGiro() {
        invertido = !invertido;
        try {
          localStorage.setItem("e2PerillaInvertida", invertido ? "1" : "0");
        } catch (error) {
          // Sin persistencia: se mantiene solo en esta sesión.
        }
        acumulado = 0;
        ultimoEnviado = null;
        alphaAnterior = ultimoAlpha;
        actualizar();
        actualizarBotonInvertir();
        estadoEl.textContent =
          "Sentido " + (invertido ? "invertido" : "normal") + ". Gira para probar.";
      }

      function alOrientar(event) {
        eventos++;
        ultimoAlpha = event.alpha;
        ultimoBeta = event.beta;
        ultimoGamma = event.gamma;

        if (event.alpha === null || event.alpha === undefined) {
          estadoEl.textContent = "Brújula no disponible en este dispositivo.";
          actualizarDiagnostico();
          return;
        }

        if (alphaAnterior !== null) {
          var delta = event.alpha - alphaAnterior;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          acumulado += delta * signo();
        }

        alphaAnterior = event.alpha;
        actualizar();
      }

      async function pedirWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (error) {
          // Sin wake lock la demo sigue funcionando.
        }
      }

      recalibrarBtn.addEventListener("click", function () {
        recalibrar();
        pedirWakeLock();
      });

      invertirBtn.addEventListener("click", function () {
        invertirGiro();
        pedirWakeLock();
      });

      // Reset que envía el PC al abrir un nuevo detalle.
      if (typeof Protobject !== "undefined" && Protobject.Core) {
        Protobject.Core.onReceived(function (mensaje) {
          if (mensaje && mensaje.tipo === "reset") {
            recalibrar();
            estadoEl.textContent = "Reiniciado por el computador. Gira desde aquí.";
          }
        });
      }

      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener("change", function () {
          alphaAnterior = ultimoAlpha;
        });
      }

      // iOS exige permiso desde un toque del usuario.
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        permisoBtn.classList.remove("oculto");
        permisoBtn.addEventListener("click", function () {
          DeviceOrientationEvent.requestPermission()
            .then(function (respuesta) {
              if (respuesta === "granted") {
                window.addEventListener("deviceorientation", alOrientar, true);
                permisoBtn.classList.add("oculto");
                estadoEl.textContent = "Brújula activa. Toca RECALIBRAR.";
              } else {
                estadoEl.textContent = "Permiso de orientación denegado.";
              }
            })
            .catch(function (error) {
              estadoEl.textContent = "Error: " + error.message;
            });
        });
      } else {
        window.addEventListener("deviceorientation", alOrientar, true);
      }

      actualizarBotonInvertir();
      actualizar();
    })();
  </script>
</body>
</html>
