<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Botones · Protobject</title>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #0b0b0b;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .botones {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    button {
      flex: 1 1 50%;
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.1s ease;
    }
    button:active { filter: brightness(0.9); }
    #arriba { background: #1baf7a; }
    #abajo { background: #2a78d6; }
  </style>
</head>
<body>
  <div class="botones">
    <button id="arriba" type="button" aria-label="Arriba"></button>
    <button id="abajo" type="button" aria-label="Abajo"></button>
  </div>
  <p id="estado" hidden></p>

  <script>
    (function () {
      function enviar(dir) {
        if (typeof Protobject === "undefined" || !Protobject.Core) return;
        Protobject.Core.send({ tipo: "nav", dir: dir }).to("index.html");
        document.getElementById("estado").textContent =
          dir === "up" ? "Subiendo…" : "Bajando…";
      }
      document.getElementById("arriba").addEventListener("click", function () {
        enviar("up");
      });
      document.getElementById("abajo").addEventListener("click", function () {
        enviar("down");
      });
    })();
  </script>
</body>
</html>
